<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ghost VPN Proxy – Servers</title>
<style>
  body { margin:0; background:#0f1720; color:#e8eef4; font:14px/1.4 system-ui, sans-serif; }
  .wrap { max-width:640px; margin:32px auto; padding:0 16px; }
  h1 { font-size:20px; }
  p.hint { color:#8a9aab; }
  .srv { background:#17212c; border-radius:12px; padding:14px; margin:14px 0; }
  .row { display:grid; grid-template-columns:110px 1fr; gap:8px; align-items:center; margin:6px 0; }
  .row label { color:#8a9aab; font-size:12px; }
  input { padding:8px; border-radius:8px; border:1px solid #2b3a49; background:#0f1720; color:#e8eef4; width:100%; }
  .actions { display:flex; gap:10px; margin-top:8px; }
  button { padding:9px 16px; border:0; border-radius:8px; cursor:pointer; font-size:14px; }
  .primary { background:#1a9d55; color:#fff; }
  .ghost { background:#2b3a49; color:#e8eef4; }
  .danger { background:none; color:#d64545; margin-left:auto; padding:0; }
  #saved { color:#1a9d55; margin-left:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Your proxy servers</h1>
  <p class="hint">Each server needs an HTTP proxy (tinyproxy, port 8118 by default) with username and password. Servers with an empty host are hidden in the popup.</p>
  <div id="list"></div>
  <div class="actions">
    <button class="ghost" id="add">+ Add server</button>
    <button class="primary" id="save">Save</button>
    <span id="saved"></span>
  </div>
</div>
<script src="shared.js"></script>
<script src="options.js"></script>
</body>
</html>
